    <div>
        <h1 id="titulo-boton">Pantalla del botón del caos</h1>
        <button onclick="cambiarColorTitulo()">boton del caos</button>
    </div>
</body>
<script>
    let contador = 0;

    function cambiarColorTitulo() {
        const colors = ['red', 'blue', 'green', 'black'];
        document.getElementById('titulo-boton').style.color = colors[contador];
        if (contador === colors.length - 1) {
            contador = 0;
        } else {
            contador++;
        }
    }
</script>
